<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOUNYA · Cookie Manager</title>
<style>
:root{color-scheme:dark;--bg:#09090f;--panel:#13131e;--line:#29283a;--muted:#a5a2b8;--purple:#9b75ff;--purple2:#7048dc;--red:#ff657a;--green:#53d6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#2b1b4c 0,transparent 42%),var(--bg);color:#f5f2ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{width:min(980px,calc(100% - 28px));margin:40px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{font-size:22px;font-weight:850;letter-spacing:.08em}.brand span{color:var(--purple)}.sub{color:var(--muted);font-size:13px;margin-top:5px}.panel{background:#13131eeF;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 60px #0005;margin-bottom:16px}.login{max-width:430px;margin:9vh auto}.h{font-size:18px;font-weight:750;margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#c9c5d8;font-size:13px;margin:0 0 7px}input,textarea{width:100%;border:1px solid #37344b;background:#0c0c14;color:white;border-radius:10px;padding:12px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--purple)}textarea{min-height:190px;resize:vertical;direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:12px}.field{margin-bottom:14px}.btn{border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;font-weight:750;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.btn.secondary{background:#29263a}.btn.danger{background:#552332;color:#ffdce2}.btn.small{padding:8px 11px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.msg{font-size:13px;color:var(--muted);margin-top:12px;min-height:20px}.msg.error{color:#ff8797}.msg.ok{color:var(--green)}.account{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.account:last-child{border:0}.name{font-weight:750}.meta{color:var(--muted);font-size:12px;margin-top:5px}.pill{font-size:11px;border-radius:99px;padding:5px 9px;background:#302a42;color:#cbbaff;display:inline-block;margin-top:7px}.pill.active{background:#153b30;color:#8af0c4}.pill.needs_update{background:#49351b;color:#ffd28a}.empty{color:var(--muted);text-align:center;padding:24px}.notice{color:var(--muted);font-size:12px;line-height:1.7;margin-top:10px}.header-actions{display:flex;gap:8px;align-items:center}@media(max-width:650px){.wrap{margin:20px auto}.panel{padding:16px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.account{align-items:flex-start;flex-direction:column}.header-actions{width:100%;justify-content:flex-end}}
</style></head>
<body><main class="wrap">
<header class="top"><div><div class="brand">DOUNYA <span>COOKIE MANAGER</span></div><div class="sub">إدارة جلسات البوت من مكان واحد</div></div><div class="header-actions"><button id="logout" class="btn secondary small hidden">تسجيل الخروج</button></div></header>
<section id="loginView" class="panel login"><h1 class="h">تسجيل الدخول</h1><form id="loginForm"><div class="field"><label for="password">كلمة مرور لوحة التحكم</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">دخول آمن</button><div id="loginMsg" class="msg"></div></form></section>
<section id="appView" class="hidden">
<div class="panel"><h2 class="h">إضافة حساب جديد</h2><form id="addForm"><div class="grid"><div class="field"><label for="accountName">اسم الحساب</label><input id="accountName" maxlength="80" placeholder="مثال: الحساب الرئيسي" required></div><div class="field"><label for="cookieFile">رفع ملف appstate JSON</label><input id="cookieFile" type="file" accept=".json,application/json"></div></div><div class="field"><label for="cookies">محتوى JSON للكوكيز</label><textarea id="cookies" spellcheck="false" placeholder='[{"key":"c_user","value":"..."},{"key":"xs","value":"..."}]' required></textarea></div><div class="actions"><button class="btn" type="submit">حفظ الحساب</button><button class="btn secondary" type="button" id="clearForm">مسح الحقول</button></div><div class="notice">يتم تشفير بيانات الجلسة قبل تخزينها. لن يتم عرض قيم الكوكيز بعد الحفظ.</div><div id="formMsg" class="msg"></div></form></div>
<div class="panel"><div class="top" style="margin:0 0 12px"><div><h2 class="h" style="margin-bottom:4px">الحسابات المحفوظة</h2><div class="sub" id="storageInfo">جارٍ تحميل الحسابات...</div></div><button class="btn secondary small" id="refresh">تحديث</button></div><div id="accounts"><div class="empty">جارٍ التحميل...</div></div><div id="listMsg" class="msg"></div></div>
</section></main>
<script>
const $=id=>document.getElementById(id);let accounts=[];
async function api(path,options={}){const response=await fetch('/admin/cookies/api'+path,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
function message(id,text,type=''){const el=$(id);el.textContent=text;el.className='msg '+type}
function showApp(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logout').classList.remove('hidden');loadAccounts() }
function showLogin(){ $('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('logout').classList.add('hidden') }
async function loadAccounts(){try{const data=await api('/accounts');accounts=data.accounts||[];$('storageInfo').textContent='التخزين: '+(data.storage==='supabase'?'Supabase دائم':'محلي - قد لا يستمر بعد إعادة النشر');renderAccounts()}catch(e){if(e.message==='unauthorized')showLogin();else message('listMsg','تعذر تحميل الحسابات: '+e.message,'error')}}
function renderAccounts(){const root=$('accounts');if(!accounts.length){root.innerHTML='<div class="empty">لا توجد حسابات محفوظة حتى الآن</div>';return}root.innerHTML=accounts.map(a=>{const state=a.status==='active'?'نشط':a.status==='needs_update'?'يحتاج تحديث':'متوقف';return `<article class="account"><div><div class="name">${escapeHtml(a.name)}</div><div class="meta">آخر تحديث: ${a.updated_at?new Date(a.updated_at).toLocaleString('ar-EG'):'—'}</div><span class="pill ${a.status}">${state}</span></div><div class="actions">${a.status==='active'?'<button class="btn secondary small" disabled>الحساب يعمل</button>':`<button class="btn small" data-action="activate" data-id="${a.id}">تفعيل وتشغيل</button>`}<button class="btn secondary small" data-action="edit" data-id="${a.id}">تعديل الاسم/الكوكيز</button><button class="btn danger small" data-action="delete" data-id="${a.id}">حذف</button></div></article>`}).join('')}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();message('loginMsg','جارٍ التحقق...');try{await api('/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';showApp()}catch(err){message('loginMsg',err.message==='invalid_password'?'كلمة المرور غير صحيحة':err.message,'error')}});
$('logout').addEventListener('click',async()=>{try{await api('/logout',{method:'POST',body:'{}'})}catch{}showLogin()});
$('cookieFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{$('cookies').value=await file.text();message('formMsg','تم تحميل الملف. راجع البيانات قبل الحفظ.','ok')}catch{message('formMsg','تعذر قراءة الملف','error')}});
$('clearForm').addEventListener('click',()=>{$('addForm').reset();message('formMsg','')});
$('addForm').addEventListener('submit',async e=>{e.preventDefault();let cookies;try{cookies=JSON.parse($('cookies').value)}catch{return message('formMsg','ملف JSON غير صالح','error')}try{await api('/accounts',{method:'POST',body:JSON.stringify({name:$('accountName').value,cookies})});$('addForm').reset();message('formMsg','تم حفظ الحساب بنجاح. فعّله من قائمة الحسابات.','ok');await loadAccounts()}catch(err){message('formMsg','تعذر الحفظ: '+err.message,'error')}});
$('accounts').addEventListener('click',async e=>{const button=e.target.closest('button[data-action]');if(!button)return;const {action,id}=button.dataset;const account=accounts.find(a=>a.id===id);if(!account)return;try{if(action==='activate'){if(!confirm('سيتم تشغيل البوت باستخدام هذا الحساب. متابعة؟'))return;await api(`/accounts/${id}/activate`,{method:'POST',body:'{}'});message('listMsg','تم تفعيل الحساب وإعادة اتصال البوت.','ok')}else if(action==='delete'){if(!confirm('هل تريد حذف هذا الحساب نهائيًا؟'))return;await api(`/accounts/${id}`,{method:'DELETE'});message('listMsg','تم حذف الحساب.','ok')}else if(action==='edit'){const name=prompt('اسم الحساب:',account.name);if(name===null)return;const raw=prompt('الصق JSON الجديد للكوكيز، أو اتركه فارغًا للاحتفاظ بالكوكيز الحالية:');const changes={name};if(raw&&raw.trim()){try{changes.cookies=JSON.parse(raw)}catch{return message('listMsg','JSON غير صالح؛ لم يتم التعديل.','error')}}await api(`/accounts/${id}`,{method:'PUT',body:JSON.stringify(changes)});message('listMsg','تم تحديث الحساب.','ok')}await loadAccounts()}catch(err){message('listMsg','فشلت العملية: '+err.message,'error')}});
$('refresh').addEventListener('click',loadAccounts);
(async()=>{try{await api('/accounts');showApp()}catch{showLogin()}})();
</script></body></html>
